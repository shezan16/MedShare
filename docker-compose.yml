version: '3.8'

services:
  # PostgreSQL with PostGIS extension for geospatial matching
  postgres:
    image: postgis/postgis:16-3.4
    container_name: medshare-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: medshare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Python FastAPI AI & OCR Microservice
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: medshare-ai
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  # Node.js + Express + Prisma + Socket.IO Backend Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: medshare-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/medshare?schema=public
      JWT_SECRET: medshare_super_secure_jwt_secret_key_2026_devorax
      JWT_EXPIRES_IN: 7d
      AI_SERVICE_URL: http://ai-service:8000
      CORS_ORIGIN: http://localhost:3000
      DEFAULT_SEARCH_RADIUS_KM: 5.0
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  # Next.js 14 Web Frontend
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: medshare-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
    depends_on:
      - server

volumes:
  postgres_data:
